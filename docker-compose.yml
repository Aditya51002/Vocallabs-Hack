services:
  redis:
    image: redis:7-alpine
    container_name: researchswarm-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    image: ${DOCKERHUB_USERNAME:-researchswarm}/researchswarm-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: researchswarm-backend
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      GROQ_RPM_BUDGET: ${GROQ_RPM_BUDGET:-28}
      GEMINI_RPM_BUDGET: ${GEMINI_RPM_BUDGET:-14}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      RESEARCHSWARM_DEMO_MODE: ${RESEARCHSWARM_DEMO_MODE:-false}
      RESEARCHSWARM_API_KEYS: ${RESEARCHSWARM_API_KEYS:-}
      MAX_RESEARCHERS: ${MAX_RESEARCHERS:-3}
      SESSION_RATE_LIMIT: ${SESSION_RATE_LIMIT:-10}
      SESSION_RATE_WINDOW_SECONDS: ${SESSION_RATE_WINDOW_SECONDS:-60}
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/api/health\")'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    image: ${DOCKERHUB_USERNAME:-researchswarm}/researchswarm-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_API_KEY: ${VITE_API_KEY:-}
        VITE_DEMO_MODE: ${VITE_DEMO_MODE:-false}
    container_name: researchswarm-frontend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
      VITE_API_KEY: ${VITE_API_KEY:-}
      VITE_DEMO_MODE: ${VITE_DEMO_MODE:-false}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  redis-data:
