name: ResearchSwarm CI/CD Pipeline (Docker Hub Registry Workflow)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    name: Backend Test Suite
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest pytest-asyncio httpx

      - name: Run Pytest Suite
        env:
          PYTHONPATH: backend
          REDIS_URL: redis://localhost:6379/0
          RESEARCHSWARM_DEMO_MODE: "true"
        run: |
          pytest backend/tests -v

  frontend-check:
    name: Frontend Type Check & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run TypeScript Type Check
        run: |
          cd frontend
          npx tsc --noEmit

      - name: Build Frontend Production Assets
        run: |
          cd frontend
          npm run build

  build-and-push-docker:
    name: Build & Push Images to Docker Hub
    needs: [backend-tests, frontend-check]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/researchswarm-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/researchswarm-backend:${{ github.sha }}

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/researchswarm-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/researchswarm-frontend:${{ github.sha }}

  deploy-ec2:
    name: Fast Deploy to AWS EC2
    needs: [build-and-push-docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            APP_DIR="/home/${{ secrets.EC2_USERNAME }}/researchswarm"
            
            if [ ! -d "$APP_DIR" ]; then
              git clone ${{ github.server_url }}/${{ github.repository }}.git "$APP_DIR"
            fi
            
            cd "$APP_DIR"
            git fetch --all
            git reset --hard origin/main
            
            # Write environment configuration
            cat << 'EOF' > .env
            DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
            GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            TAVILY_API_KEY=${{ secrets.TAVILY_API_KEY }}
            GROQ_MODEL=llama-3.3-70b-versatile
            GEMINI_MODEL=gemini-2.0-flash
            REDIS_URL=redis://redis:6379/0
            CORS_ORIGIN=http://${{ secrets.EC2_HOST }}:3000,http://localhost:3000
            RESEARCHSWARM_DEMO_MODE=false
            RESEARCHSWARM_JWT_SECRET=${{ secrets.RESEARCHSWARM_JWT_SECRET }}
            MAX_RESEARCHERS=3
            EOF

            # Pull pre-built images from Docker Hub & restart containers fast
            docker compose pull
            docker compose up -d --remove-orphans

            # Healthcheck verification
            echo "Waiting for services to become healthy..."
            sleep 15
            docker compose ps
